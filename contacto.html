    <link rel="stylesheet" href="style.css">
</head>

<body>

            <a class="navbar-brand d-flex align-items-center" href="index.html">

    <!-- ENCABEZADO -->
    <header class="page-header">
        <h1>Contacto</h1>
        <p>Escríbenos y conoce más sobre Minuta Fresh.</p>
    </header>

    <!-- FORMULARIO DE CONTACTO -->
    <main class="content-section">
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <div class="contact-card">

                        <div class="text-center mb-4">
                            <i class="fa-solid fa-envelope-open-text contact-icon"></i>
                            <h2>Envíanos un mensaje</h2>
                            <p>Completa el formulario y nos pondremos en contacto contigo.</p>
                        </div>

                        <form id="contactForm">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="nombre"
                                    name="nombre"
                                    placeholder="Escribe tu nombre"
                                    maxlength="100"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="ejemplo@gmail.com"
                                    maxlength="200"
                                    required>
                            </div>

                            <div class="mb-4">
                                <label for="mensaje" class="form-label">Mensaje</label>
                                <textarea
                                    class="form-control"
                                    id="mensaje"
                                    name="mensaje"
                                    rows="6"
                                    maxlength="1000"
                                    placeholder="Escribe tu mensaje..."
                                    required></textarea>
                            </div>

                            <div class="text-center">
                                <button
                                    type="submit"
                                    class="btn-minuta"
                                    id="btnEnviar">
                                    <i class="fa-solid fa-paper-plane"></i>
                                    Enviar mensaje
                                </button>
                            </div>

                            <div
                                id="contactResult"
                                class="alert mt-4"
                                role="status"
                                aria-live="polite"
                                style="display: none;">
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        <div class="container text-center">
            <p>Minuta Fresh · Contacto</p>
        </div>
    </footer>

    <!-- LIBRERÍAS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

    <!-- ENVÍO DEL FORMULARIO A DISCORD -->
    <script>
        $(function () {$("#contactForm").on("submit", function (evento) {
                evento.preventDefault();

                const nombre = $("#nombre").val().trim();
                const email = $("#email").val().trim();
                const mensaje = $("#mensaje").val().trim();

                const boton = $("#btnEnviar");
                const resultado = $("#contactResult");

                if (!nombre || !email || !mensaje) {
                    resultado
                        .removeClass("alert-success alert-info")
                        .addClass("alert-danger")
                        .text("Completa todos los campos.")
                        .stop(true, true)
                        .fadeIn();
                    return;
                }

                boton.prop("disabled", true);

                resultado
                    .removeClass("alert-danger alert-success")
                    .addClass("alert-info")
                    .text("Enviando mensaje...")
                    .stop(true, true)
                    .fadeIn();

                // PEGA TU ENLACE DE DISCORD AQUÍ ENTRE LAS COMILLAS
                const webhookURL = "https://discord.com/api/webhooks/1557746325364412486/hARqnbRxguhCotdpoTwd-Bpl9jXsKJjSdO4-34EN4Uzc9uxhPg5MJxq_qhLmRI_0Gm2z";

                const contenido = {
                    content: `📩 **Nuevo mensaje de Minuta Fresh**\n👤 **Nombre:** ${nombre}\n📧 **Correo:** ${email}\n💬 **Mensaje:** ${mensaje}`
                };

                $.ajax({
                    url: webhookURL,
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(contenido)
                })
                .done(function () {
                    resultado
                        .removeClass("alert-info alert-danger")
                        .addClass("alert-success")
                        .text("¡Mensaje enviado correctamente a Discord!")
                        .stop(true, true)
                        .fadeIn();

                    $("#contactForm")[0].reset();
                })
                .fail(function () {
                    resultado
                        .removeClass("alert-info alert-success")
                        .addClass("alert-danger")
                        .text("No se pudo enviar el mensaje. Inténtalo nuevamente.")
                        .stop(true, true)
                        .fadeIn();
                })
                .always(function () {
                    boton.prop("disabled", false);
                });
            });
        });
    </script>

</body>
</html>
